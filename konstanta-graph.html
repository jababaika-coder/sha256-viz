<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нити «Архива Константы»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Jura:wght@400;600&display=swap">
<style>
/* Звёздная карта книги: главы — звёзды на орбите, ружья и герои — светящиеся нити. Одна тёмная тема намеренно. */
:root{
  --bg:#0a0e1c; --bg2:#111731; --line:#232b4d; --fg:#e9e6dc; --muted:#8d93b3; --accent:#f5c542;
  --p1:#6d7cff; --p2:#3fb6c9; --p3:#c77dff; --p4:#ff7a59;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Jura","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 800px at 50% 30%,#141b3a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.4vw,46px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:64ch}
.ctrls{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg2)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;min-width:0}
svg{display:block;width:100%;height:auto;max-width:100%}
.edge{fill:none;stroke-linecap:round;mix-blend-mode:screen;transition:opacity .25s;cursor:pointer}
.node{cursor:pointer}
.node text{font-family:var(--f-ui);font-size:13px;fill:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.node:hover text,.node.sel text{fill:var(--fg)}
.focus .edge{opacity:.05!important}
.focus .edge.on{opacity:.95!important}
.focus .node{opacity:.35}
.focus .node.on{opacity:1}
.partlbl{font-family:var(--f-display);font-style:italic;font-size:17px;fill:var(--muted)}
.partarc{fill:none;stroke-width:3;stroke-linecap:round;opacity:.8}
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:color-mix(in srgb,var(--bg2) 85%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.lgroup{display:flex;flex-direction:column;gap:6px}
.lgroup + .lgroup{margin-top:12px}
.ghead{all:unset;cursor:pointer;font-family:var(--f-display);font-style:italic;font-size:15px;color:var(--fg)}
.ghead:hover{color:var(--accent)}
.ghead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.chip small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.chip.off{opacity:.35}
.chip.off i{box-shadow:none}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.mini button{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.mini button:hover{color:var(--fg)}
#info h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
#info .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
#info ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
#info li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4}
#info li i{width:10px;height:10px;border-radius:50%;display:block;transform:translateY(1px)}
#info li b{font-weight:600}
#info li span{color:var(--muted)}
#info li em{font-style:normal;color:var(--fg)}
#info .hint{color:var(--muted);font-size:13.5px;margin:0}
.bridges{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bridges button{all:unset;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;font-size:13.5px}
.bridges .gap{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.bridges .t{color:var(--muted)}
.bridges .t b{color:var(--fg);font-weight:600}
.bridges button:hover .t{color:var(--fg)}
.bridges button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{color:var(--muted);font-size:12.5px;max-width:84ch;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.spn{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:#e8b45c;color:#1a1206;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;vertical-align:middle}
.blur{filter:blur(4px);user-select:none}
.spbtn{all:unset;cursor:pointer;display:inline-block;color:var(--muted);font-size:13px}
.spbtn:hover .spn{background:#ffd27a}
.spchip{opacity:.85}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>

<div class="wrap">

  <p class="foot" id="foot"></p>
</div>

const partOf = n => PARTS.findIndex(p=>n>=p.from&&n<=p.to);
const byN = Object.fromEntries(DATA.map(d=>[d.n,d]));

// ---------- два набора нитей ----------
function buildGuns(){
  const edges=[], notes={};
  for(const t of THREADS){
    t.chain.forEach(([n,txt,sp],i)=>{
      (notes[n] ||= []).push({t,txt,sp,n,prev:t.chain[i-1]?.[0],next:t.chain[i+1]?.[0]});
      if(i>0) edges.push({a:t.chain[i-1][0],b:n,id:t.id,na:t.chain[i-1][1],nb:txt,spa:t.chain[i-1][2],spb:sp});
    });
  }
  return {edges,notes,items:THREADS,meta:Object.fromEntries(THREADS.map(t=>[t.id,t]))};
}
function buildHeroes(){
  const edges=[];
  for(const c of CHARS){
    let prev=null;
    for(const d of DATA){
      if(d.c[c.id]>=TH){ if(prev) edges.push({a:prev.n,b:d.n,id:c.id,w:Math.min(prev.c[c.id],d.c[c.id])}); prev=d; }
    }
  }
  return {edges,items:CHARS,meta:Object.fromEntries(CHARS.map(c=>[c.id,c]))};
}
const MODES={guns:buildGuns(),heroes:buildHeroes()};
for(const m of Object.values(MODES)){
  const groups={};
  for(const e of m.edges){ (groups[e.a+"-"+e.b] ||= []).push(e); }
  for(const k in groups) groups[k].forEach((e,i)=>{e.i=i;e.k=groups[k].length;});
}

const TEXT={
  guns:{sub:"46 глав — звёзды на орбите. Нить ведёт от главы, где ружьё повесили, к главе, где оно снова появилось или выстрелило. Соседние главы связаны дугой по ободу.",
        legend:"Ружья и события · нажми, чтобы скрыть. Нити и подписи с плашкой «спойлер» открываются только по клику",
        hint:"Наведи на главу: справа появится, какие ружья в ней висят и куда стреляют. Клик закрепляет выбор, клик по нити показывает одну связь.",
        foot:"Нити собраны вручную по финальным файлам глав: предмет или событие, которое появляется и потом возвращается или срабатывает. Подписи к главам — что именно с ним происходит в этой главе."},
  heroes:{sub:"46 глав — звёзды на орбите. Нить соединяет две главы, если герой есть в обеих, а между ними не появляется. Толщина — сколько раз герой упомянут.",
        legend:"Персонажи · нажми, чтобы скрыть",
        hint:"Наведи на главу, чтобы увидеть, откуда и куда тянутся нити её героев. Клик закрепляет выбор.",
        foot:"Герой «есть» в главе, если его имя встречается там хотя бы трижды в любом падеже . Это упоминания, а не сцены."}
};

let mode="guns", layout="circle", pinned=null;
const opened=new Set();            // раскрытые спойлер-нити
const openedNotes=new Set();       // раскрытые подписи "id:глава"
const isSp=id=>!!(MODES.guns.meta[id]&&MODES.guns.meta[id].sp)&&!opened.has(id);
const SPN='<span class="spn">спойлер</span>';
const hidden={guns:new Set(),heroes:new Set()};
const svg=document.getElementById("g");
const info=document.getElementById("info");
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const M=()=>MODES[mode];
const H=()=>hidden[mode];
const f1=x=>x.toFixed(1);

function positions(){
  const pos={};
  if(layout==="circle"){
    const cx=500,cy=500,R=380,gap=1.6;
    const slots=DATA.length+PARTS.length*gap;
    let s=gap/2;
    DATA.forEach((d,i)=>{
      if(i>0 && partOf(d.n)!==partOf(DATA[i-1].n)) s+=gap;
      const a=-Math.PI/2+(s/slots)*Math.PI*2;
      pos[d.n]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a};
      s+=1;
    });
    return {pos,vb:"0 0 1000 1000",cx,cy,R};
  }
  const W=1400,L=40,y=430;let x=L;const step=(W-2*L-3*22)/(DATA.length-1);
  DATA.forEach((d,i)=>{ if(i>0 && partOf(d.n)!==partOf(DATA[i-1].n)) x+=22; pos[d.n]={x,y}; x+=step; });
  return {pos,vb:`0 0 ${W} 520`,y};
}

function edgePath(e,P){
  const p1=P.pos[e.a],p2=P.pos[e.b];
  const off=e.i-(e.k-1)/2;
  if(layout==="circle"){
    if(e.b-e.a===1){
      // соседние главы — по ободу; параллельные нити ложатся концентрически внутрь
      const r=P.R-e.i*5.5;
      const q1={x:P.cx+r*Math.cos(p1.a),y:P.cy+r*Math.sin(p1.a)}, q2={x:P.cx+r*Math.cos(p2.a),y:P.cy+r*Math.sin(p2.a)};
      return `M${f1(p1.x)},${f1(p1.y)} L${f1(q1.x)},${f1(q1.y)} A${f1(r)},${f1(r)} 0 0 1 ${f1(q2.x)},${f1(q2.y)} L${f1(p2.x)},${f1(p2.y)}`;
    }
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    const t=0.38+0.5*Math.min(1,(e.b-e.a)/23);
    let qx=mx+(P.cx-mx)*t,qy=my+(P.cy-my)*t;
    const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1;
    qx+=(-dy/len)*off*14+(P.cx-mx)*off*0.05;
    qy+=( dx/len)*off*14+(P.cy-my)*off*0.05;
    return `M${f1(p1.x)},${f1(p1.y)} Q${f1(qx)},${f1(qy)} ${f1(p2.x)},${f1(p2.y)}`;
  }
  const dx=p2.x-p1.x;
  const h=16+e.i*7+Math.pow(dx,0.86)*0.55;
  return `M${f1(p1.x)},${P.y} C${f1(p1.x)},${f1(P.y-h)} ${f1(p2.x)},${f1(P.y-h)} ${f1(p2.x)},${P.y}`;
}

function render(){
  const P=positions(), m=M();
  svg.setAttribute("viewBox",P.vb);
  svg.innerHTML="";
  const defs=el("defs",{},svg);
  const f=el("filter",{id:"glow",x:"-50%",y:"-50%",width:"200%",height:"200%"},defs);
  el("feGaussianBlur",{stdDeviation:"2",result:"b"},f);
  const mg=el("feMerge",{},f);el("feMergeNode",{in:"b"},mg);el("feMergeNode",{in:"SourceGraphic"},mg);

  const dust=el("g",{opacity:.5},svg);
  const [, , VW, VH]=P.vb.split(" ").map(Number);
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  for(let i=0;i<140;i++) el("circle",{cx:f1(rnd()*VW),cy:f1(rnd()*VH),r:(rnd()*1.1+.2).toFixed(2),fill:"#c9cff5",opacity:(rnd()*.6+.1).toFixed(2)},dust);

  const pg=el("g",{},svg);
  PARTS.forEach(p=>{
    const a=P.pos[p.from],b=P.pos[p.to];
    if(layout==="circle"){
      const r=P.R+46,a1=a.a-0.03,a2=b.a+0.03;
      el("path",{d:`M${f1(P.cx+r*Math.cos(a1))},${f1(P.cy+r*Math.sin(a1))} A${r},${r} 0 ${a2-a1>Math.PI?1:0} 1 ${f1(P.cx+r*Math.cos(a2))},${f1(P.cy+r*Math.sin(a2))}`,class:"partarc",stroke:p.color},pg);
      const am=(a1+a2)/2,rl=r+26;
      el("text",{x:f1(P.cx+rl*Math.cos(am)),y:f1(P.cy+rl*Math.sin(am)),"text-anchor":"middle","dominant-baseline":"middle",class:"partlbl"},pg).textContent=p.name;
    } else {
      el("path",{d:`M${a.x-6},${P.y+38} L${b.x+6},${P.y+38}`,class:"partarc",stroke:p.color},pg);
      el("text",{x:(a.x+b.x)/2,y:P.y+66,"text-anchor":"middle",class:"partlbl"},pg).textContent=p.name;
    }
  });

  const eg=el("g",{filter:"url(#glow)"},svg);
  const ordered=[...m.edges].sort((x,y)=>(x.id==="alan"?0:1)-(y.id==="alan"?0:1));
  for(const e of ordered){
    if(H().has(e.id)) continue;
    if(mode==="guns"&&isSp(e.id)) continue;
    const it=m.meta[e.id];
    const w=mode==="heroes"?0.8+Math.sqrt(e.w)*0.42:2.1;
    const p=el("path",{d:edgePath(e,P),class:"edge",stroke:it.color,"stroke-width":w.toFixed(2),opacity:(e.id==="alan"?.38:.66)},eg);
    p._e=e;
    el("title",{},p).textContent=`${it.name}: гл. ${e.a} → гл. ${e.b}`;
    p.addEventListener("click",ev=>{ev.stopPropagation();focusEdge(e);});
  }

  const ng=el("g",{},svg);
  for(const d of DATA){
    const p=P.pos[d.n];
    const g=el("g",{class:"node",tabindex:0,"data-n":d.n,role:"button","aria-label":`Глава ${d.n}. ${d.title}`},ng);
    const r=3.4+Math.sqrt(d.len/1000)*0.95;
    const col=PARTS[partOf(d.n)].color;
    el("circle",{cx:f1(p.x),cy:f1(p.y),r:f1(r+5),fill:col,opacity:.18},g);
    el("circle",{cx:f1(p.x),cy:f1(p.y),r:f1(r),fill:"#fffaf0",stroke:col,"stroke-width":2},g);
    let tx,ty;
    if(layout==="circle"){const rl=P.R+22;tx=P.cx+rl*Math.cos(p.a);ty=P.cy+rl*Math.sin(p.a);} else {tx=p.x;ty=P.y+22;}
    el("text",{x:f1(tx),y:f1(ty),"text-anchor":"middle","dominant-baseline":"middle"},g).textContent=d.n;
    g.addEventListener("mouseenter",()=>{if(!pinned)focusNode(d.n)});
    g.addEventListener("mouseleave",()=>{if(!pinned)clearFocus()});
    g.addEventListener("click",ev=>{ev.stopPropagation();pinned=(pinned===d.n?null:d.n);if(pinned)focusNode(d.n);else clearFocus();});
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();g.dispatchEvent(new MouseEvent("click"));}});
  }
  if(pinned) focusNode(pinned); else clearFocus();
}

function setFocus(test,nodes){
  svg.classList.add("focus");
  svg.querySelectorAll(".edge").forEach(p=>p.classList.toggle("on",test(p._e)));
  svg.querySelectorAll(".node").forEach(g=>{const n=+g.dataset.n;g.classList.toggle("on",nodes.has(n));g.classList.toggle("sel",nodes.has(n));});
}
function clearFocus(){
  svg.classList.remove("focus");
  svg.querySelectorAll(".on,.sel").forEach(x=>x.classList.remove("on","sel"));
  info.innerHTML=`<p class="hint">${TEXT[mode].hint}</p>`;
}
const head=n=>`<p class="eyebrow">Часть ${partOf(n)+1} · ${PARTS[partOf(n)].name}</p><h2>${n}. ${byN[n].title}</h2>`;

function focusNode(n){
  lastFocus=()=>focusNode(n);
  const m=M(), nodes=new Set([n]);
  m.edges.forEach(e=>{if(!H().has(e.id)&&!(mode==="guns"&&isSp(e.id))&&(e.a===n||e.b===n)){nodes.add(e.a);nodes.add(e.b);}});
  setFocus(e=>e.a===n||e.b===n,nodes);
  let rows="";
  if(mode==="guns"){
    rows=(m.notes[n]||[]).filter(x=>!H().has(x.t.id)).map(x=>{
      if(isSp(x.t.id)) return `<li><i style="background:#555b7a"></i><div><button class="spbtn" data-open="${x.t.id}">${SPN} Скрытая нить — нажмите, чтобы открыть</button></div></li>`;
      const from=x.prev?`из гл. ${x.prev}`:"повешено здесь", to=x.next?`в гл. ${x.next}`:"финал нити";
      return `<li><i style="background:${x.t.color}"></i><div><b>${x.t.name}</b> <span>· ${from} → ${to}</span><br>${noteHtml(x.t.id,x.n,x.txt,x.sp)}</div></li>`;
    }).join("");
  } else {
    const d=byN[n];
    rows=CHARS.filter(c=>d.c[c.id]>=TH&&!H().has(c.id)).sort((x,y)=>d.c[y.id]-d.c[x.id]).map(c=>{
      const inE=m.edges.find(e=>e.id===c.id&&e.b===n), outE=m.edges.find(e=>e.id===c.id&&e.a===n);
      return `<li><i style="background:${c.color}"></i><div><b>${c.name}</b> <span>· ${d.c[c.id]} упом. · ${inE?`из гл. ${inE.a}`:"впервые"} → ${outE?`в гл. ${outE.b}`:"дальше нет"}</span></div></li>`;
    }).join("");
  }
  info.innerHTML=head(n)+`<div class="meta">${(byN[n].len/1000).toFixed(1)} тыс. знаков</div>`+(rows?`<ul>${rows}</ul>`:`<p class="hint">${mode==="guns"?"Здесь ружья не висят и не стреляют.":"Видимых героев здесь нет."}</p>`);
}
function focusEdge(e){
  lastFocus=()=>focusEdge(e);
  pinned=null;
  const it=M().meta[e.id];
  setFocus(x=>x===e,new Set([e.a,e.b]));
  const na=e.na?`<br>${noteHtml(e.id,e.a,e.na,e.spa)}`:"", nb=e.nb?`<br>${noteHtml(e.id,e.b,e.nb,e.spb)}`:"";
  info.innerHTML=`<p class="eyebrow">${e.b-e.a===1?"Соседние главы":`Мост через ${e.b-e.a-1} гл.`}</p><h2>${it.name}</h2><div class="meta">гл. ${e.a} → гл. ${e.b}</div><ul>
  <li><i style="background:${it.color}"></i><div><b>${e.a}. ${byN[e.a].title}</b>${na}</div></li>
  <li><i style="background:${it.color}"></i><div><b>${e.b}. ${byN[e.b].title}</b>${nb}</div></li></ul>`;
}
svg.addEventListener("click",()=>{pinned=null;clearFocus();});
function noteHtml(id,n,txt,sp){
  if(sp&&!openedNotes.has(id+":"+n)) return `<button class="spbtn" data-note="${id}:${n}">${SPN} <span class="blur">${txt.replace(/[^\s«»—.,:;!?]/g,"x")}</span></button>`;
  return `<em>${txt}</em>`;
}
info.addEventListener("click",ev=>{
  const b=ev.target.closest(".spbtn"); if(!b) return;
  ev.stopPropagation();
  if(b.dataset.note){ openedNotes.add(b.dataset.note); }
  if(b.dataset.open){ opened.add(b.dataset.open); H().delete(b.dataset.open); drawLegend(); drawBridges(); render(); }
  const keep=pinned; if(lastFocus) lastFocus();
});
let lastFocus=null;

// ---------- легенда ----------
const legend=document.getElementById("legend"), mini=document.getElementById("mini");
function chip(it,count){
  if(mode==="guns"&&isSp(it.id)){
    const s=document.createElement("button");
    s.className="chip spchip"; s.title="Спойлер — нажмите, чтобы открыть";
    s.innerHTML=`<i style="background:#555b7a"></i>${SPN}<span class="blur">${it.name.replace(/[^\s«»]/g,"x")}</span>`;
    s.addEventListener("click",()=>{opened.add(it.id);H().delete(it.id);pinned=null;drawLegend();drawBridges();render();});
    return s;
  }
  const b=document.createElement("button");
  b.className="chip"+(H().has(it.id)?" off":"");
  b.style.color=it.color;
  b.setAttribute("aria-pressed",String(!H().has(it.id)));
  b.innerHTML=`<i style="background:${it.color}"></i><span style="color:var(--fg)">${it.name}</span><small>${count}</small>`;
  b.title=`${it.name}: ${count} гл.`;
  b.addEventListener("click",()=>{H().has(it.id)?H().delete(it.id):H().add(it.id);pinned=null;drawLegend();render();});
  b.addEventListener("mouseenter",()=>{if(H().has(it.id)||pinned)return;
    const ns=new Set();M().edges.forEach(e=>{if(e.id===it.id){ns.add(e.a);ns.add(e.b);}});setFocus(e=>e.id===it.id,ns);});
  b.addEventListener("mouseleave",()=>{if(!pinned)clearFocus();});
  return b;
}
function drawLegend(){
  document.getElementById("legend-title").textContent=TEXT[mode].legend;
  legend.innerHTML="";mini.innerHTML="";
  if(mode==="guns"){
    for(const g of GROUPS){
      const box=document.createElement("div");box.className="lgroup";
      const hd=document.createElement("button");hd.className="ghead";hd.textContent=g.name;
      const ids=THREADS.filter(t=>t.g===g.id).map(t=>t.id);
      hd.title="Показать или скрыть всю группу";
      hd.addEventListener("click",()=>{const allOn=ids.every(id=>!H().has(id));ids.forEach(id=>allOn?H().add(id):H().delete(id));pinned=null;drawLegend();render();});
      box.appendChild(hd);
      const row=document.createElement("div");row.className="legend";
      THREADS.filter(t=>t.g===g.id).forEach(t=>row.appendChild(chip(t,t.chain.length)));
      box.appendChild(row);legend.appendChild(box);
    }
    GROUPS.forEach(g=>{const b=document.createElement("button");b.textContent="только "+g.name.toLowerCase();
      b.onclick=()=>{H().clear();THREADS.forEach(t=>{if(t.g!==g.id)H().add(t.id)});pinned=null;drawLegend();render();};mini.appendChild(b);});
  } else {
    const row=document.createElement("div");row.className="legend";
    CHARS.forEach(c=>row.appendChild(chip(c,DATA.filter(d=>d.c[c.id]>=TH).length)));
    legend.appendChild(row);
    const b=document.createElement("button");b.textContent="все, кроме Алана";b.onclick=()=>{H().clear();H().add("alan");drawLegend();render();};mini.appendChild(b);
  }
  const all=document.createElement("button");all.textContent="все";all.onclick=()=>{H().clear();drawLegend();render();};
  const none=document.createElement("button");none.textContent="ничего";none.onclick=()=>{M().items.forEach(i=>H().add(i.id));drawLegend();render();};
  mini.prepend(all,none);
}

function drawBridges(){
  const br=document.getElementById("bridges");br.innerHTML="";
  [...M().edges].filter(e=>!(mode==="guns"&&isSp(e.id))).sort((x,y)=>(y.b-y.a)-(x.b-x.a)).slice(0,7).forEach(e=>{
    const it=M().meta[e.id];
    const li=document.createElement("li"),b=document.createElement("button");
    b.innerHTML=`<span class="gap" style="color:${it.color}">${e.b-e.a}</span><span class="t"><b>${it.name}</b>: гл. ${e.a} «${byN[e.a].title}» → гл. ${e.b} «${byN[e.b].title}»</span>`;
    b.addEventListener("click",()=>{if(H().has(e.id)){H().delete(e.id);drawLegend();render();}focusEdge(e);});
    li.appendChild(b);br.appendChild(li);
  });
}

function setMode(mo){
  mode=mo;pinned=null;
  document.getElementById("m-guns").setAttribute("aria-pressed",mo==="guns");
  document.getElementById("m-heroes").setAttribute("aria-pressed",mo==="heroes");
  document.getElementById("sub").textContent=TEXT[mo].sub;
  document.getElementById("foot").textContent=TEXT[mo].foot;
  drawLegend();drawBridges();render();
}
document.getElementById("m-guns").onclick=()=>setMode("guns");
document.getElementById("m-heroes").onclick=()=>setMode("heroes");
const bc=document.getElementById("lay-circle"),ba=document.getElementById("lay-arc");
function setLayout(l){layout=l;bc.setAttribute("aria-pressed",l==="circle");ba.setAttribute("aria-pressed",l==="arc");render();}
bc.onclick=()=>setLayout("circle");ba.onclick=()=>setLayout("arc");

setMode("guns");
</script>

</body>
